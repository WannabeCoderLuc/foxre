<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 80" width="540" height="80">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="foxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Fox Emblem -->
  <g transform="translate(10, 5) scale(0.7)">
    <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0d141f" stroke="#00e5ff" stroke-width="2.5" />
    <polygon points="50,22 30,34 26,16" fill="url(#foxGrad)" filter="url(#glow2)" />
    <polygon points="50,22 70,34 74,16" fill="url(#foxGrad)" filter="url(#glow2)" />
    <polygon points="50,22 30,34 50,56" fill="#00e5ff" opacity="0.9" />
    <polygon points="50,22 70,34 50,56" fill="#00b4d8" opacity="0.9" />
    <polygon points="30,34 18,48 50,56" fill="#0077b6" opacity="0.8" />
    <polygon points="70,34 82,48 50,56" fill="#023e8a" opacity="0.8" />
    <polygon points="50,56 36,66 50,82" fill="#00e5ff" opacity="0.95" />
    <polygon points="50,56 64,66 50,82" fill="#0096c7" opacity="0.95" />
    <circle cx="42" cy="42" r="2.5" fill="#ffffff" />
    <circle cx="58" cy="42" r="2.5" fill="#ffffff" />
  </g>
  <!-- Text Brand -->
  <text x="95" y="42" font-family="'JetBrains Mono', Consolas, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="url(#textGrad)" filter="url(#glow2)">FOX<tspan fill="#ffb300">RE</tspan></text>
  <text x="96" y="62" font-family="'JetBrains Mono', Consolas, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#00e5ff" opacity="0.85">OPEN FOX ENGINE // REVERSE ENGINEERING EXPLORER</text>
  <rect x="96" y="68" width="420" height="1.5" fill="rgba(0, 229, 255, 0.3)" />
</svg>
